name: Feature request
description: An idea for something Slipstream Recomp doesn't do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [existing issues](https://github.com/NRTakeda/SlipstreamRecomp/issues?q=is%3Aissue) first. Online play and other versions of the game are not planned.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like Slipstream Recomp to do, and why it would help.
    validations:
      required: true
