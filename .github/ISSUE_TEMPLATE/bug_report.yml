name: Bug report
description: Something in Slipstream Recomp doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please read [Mario Kart 8 Deluxe](https://github.com/NRTakeda/SlipstreamRecomp/blob/slipstream/docs/mk8dx.md) first, and use the latest release.
        **Never attach or link game files, keys, firmware or generated code**: issues that do are removed.
  - type: input
    id: release
    attributes:
      label: Slipstream Recomp release
      description: The AppImage's name, or the commit for a source build.
      placeholder: Slipstream_Recomp-0.6.0-alpha.6-x86_64.AppImage
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer
      description: Steam Deck (LCD or OLED), or your Linux distribution and GPU.
      placeholder: Steam Deck OLED, SteamOS 3.7
    validations:
      required: true
  - type: checkboxes
    id: game
    attributes:
      label: Game files
      options:
        - label: My game is Mario Kart 8 Deluxe version 4.0.1, extracted from my own console, without mods.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did right before it (course, mode, menu), what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: savagewind.log
      description: Attach `savagewind.log` from `~/.local/share/slipstream-recomp` (drag the file here).
    validations:
      required: true
